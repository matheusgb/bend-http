name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: instala o Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: checa cada arquivo sozinho
        run: bend tests.bend --checkup
      - name: testes puros
        run: bend tests.bend
      - name: teste de fio, backend JS
        run: python3 wire_test.py
      - name: teste de fio, binario nativo
        run: |
          mkdir -p out
          bend wire.bend -o out/wire
          python3 wire_test.py out/wire
