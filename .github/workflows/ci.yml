name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bend
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: bend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: instala o Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: checa cada arquivo sozinho
        run: bend example.bend --checkup
      - name: provas
        run: bend PROOF.bend
      - name: testes puros
        run: bend tests.bend
      - name: teste de fio
        run: python3 wire_test.py
      - name: teste de ponta a ponta
        run: python3 http_test.py
      - name: testes contra o Postgres
        run: bend db_tests.bend
      - name: servidor falso de SCRAM
        run: python3 scram_test.py
      - name: binario nativo
        run: |
          mkdir -p out
          bend tests.bend -o out/tests
          bend db_tests.bend -o out/dbtests
          bend wire.bend -o out/wire
          bend example.bend -o out/app
          ./out/tests
          ./out/dbtests
          python3 wire_test.py out/wire
          python3 http_test.py out/app
